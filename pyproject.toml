[project]
name = "quartet-ii"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "datasets>=4.8.5",
    "fast-hadamard-transform>=1.1.0",
    "schedulefree>=1.4.1",
    "scipy>=1.17.1",
    "tiktoken>=0.13.0",
    "torch>=2.9.0",
    "tqdm==4.67.1",
    "transformers>=5.9.0",
    "wandb>=0.27.0",
    "zstandard>=0.25.0",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["models"]

[tool.uv.extra-build-dependencies]
fast-hadamard-transform = ["torch"]

[tool.uv.sources]
fast-hadamard-transform = { git = "https://github.com/Dao-AILab/fast-hadamard-transform.git", tag = "v1.1.0" }
